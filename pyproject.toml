[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suno-mcp"
version = "1.2.0"
description = "MCP server: Playwright automation against suno.com (fragile); DOM recon tools; no official Suno API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
{name = "Sandra Schipal", email = "sandraschipal@gmail.com"},
]
maintainers = [
    {name = "Sandra Schipal", email = "sandraschipal@gmail.com"},
]
keywords = ["mcp", "suno", "ai", "music", "automation", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "uvloop>=0.17.0 ; sys_platform != 'win32'",
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.16.0,<0.17",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/sandraschi/suno-mcp"
Documentation = "https://github.com/sandraschi/suno-mcp#readme"
Repository = "https://github.com/sandraschi/suno-mcp"
Issues = "https://github.com/sandraschi/suno-mcp/issues"
Changelog = "https://github.com/sandra/suno-mcp/blob/main/CHANGELOG.md"

[project.scripts]
suno-mcp = "suno_mcp.server:main"
suno-mcp-api = "suno_mcp.server:main_api"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
suno_mcp = ["py.typed", "skills/**/*.md"]

# Mypy and isort checked via ruff

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "--cov=suno_mcp",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S106", "S110", "S112", "S101", "B008", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

